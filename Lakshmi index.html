<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lakshmi Devi V | Executive Support Portfolio</title>
<meta name="description" content="Personal portfolio of Lakshmi Devi V, a final-year Computer Science and Engineering student at Government College of Technology, Coimbatore, with leadership, communication and coordination experience, seeking executive and administrative support roles.">
<meta name="author" content="Lakshmi Devi V">
<meta name="theme-color" content="#101B2D">
<meta property="og:type" content="website">
<meta property="og:title" content="Lakshmi Devi V | Executive Support Portfolio">
<meta property="og:description" content="People. Purpose. Precision in every detail. Communication, leadership and administrative coordination.">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#101B2D; --ivory:#F8F6F1; --ivory2:#F0ECE3; --gold:#C6A66B; --gold-deep:#8A6D33;
  --char:#262A30; --grey:#777C84; --grey-text:#5C616A; --white:#FFFFFF;
  --serif:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --pad:clamp(20px,5vw,64px);
  --navh:72px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--navh) + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--char);font-family:var(--sans);font-size:17px;line-height:1.7;font-weight:400;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.skip{position:absolute;left:-999px;top:8px;background:var(--navy);color:var(--ivory);padding:10px 16px;z-index:200}
.skip:focus{left:8px}

/* ---------- layout ---------- */
.wrap{width:100%;max-width:1280px;margin:0 auto;padding-inline:var(--pad)}
.sec{padding-block:clamp(84px,11vw,160px);position:relative}
.bg-white{background:var(--white)}
.bg-ivory2{background:var(--ivory2)}
.bg-navy{background:var(--navy);color:var(--ivory)}
.kicker{display:flex;align-items:center;gap:14px;font-size:14px;letter-spacing:.08em;color:var(--gold-deep);margin-bottom:26px;font-weight:500}
.kicker::before{content:"";width:40px;height:1px;background:var(--gold)}
.bg-navy .kicker{color:var(--gold)}
.display{font-family:var(--serif);font-weight:500;line-height:1.02;letter-spacing:-.01em;font-size:clamp(40px,6.4vw,92px)}
.display.md{font-size:clamp(34px,4.8vw,66px);line-height:1.06}
.lede{font-size:clamp(17px,1.5vw,20px);color:var(--grey-text);max-width:60ch}
.bg-navy .lede{color:rgba(248,246,241,.76)}
.rule{display:block;width:100%;height:1px;background:var(--gold);opacity:.7}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(16px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

/* ---------- nav ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;height:var(--navh);display:flex;align-items:center;background:rgba(248,246,241,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .4s,background .4s}
.nav.scrolled{border-bottom-color:rgba(198,166,107,.55);background:rgba(248,246,241,.94)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.26em;text-decoration:none;color:var(--navy)}
.menu{display:none;gap:clamp(18px,2.2vw,34px)}
.menu a{font-size:14px;font-weight:500;letter-spacing:.04em;text-decoration:none;color:var(--char);padding:6px 0;background:linear-gradient(var(--gold),var(--gold)) 0 100%/0 1px no-repeat;transition:background-size .35s ease,color .3s}
.menu a:hover,.menu a.act{background-size:100% 1px;color:var(--navy)}
.burger{display:inline-flex;flex-direction:column;justify-content:center;gap:6px;width:44px;height:44px;background:none;border:0;cursor:pointer;padding:10px;margin-right:-10px}
.burger span{display:block;height:1px;width:100%;background:var(--navy);transition:transform .35s,opacity .25s}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.drawer{position:fixed;inset:0;z-index:90;background:var(--navy);color:var(--ivory);padding:calc(var(--navh) + env(safe-area-inset-top,0px) + 24px) var(--pad) 40px;display:flex;flex-direction:column;justify-content:space-between;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.drawer.open{opacity:1;visibility:visible}
.drawer a.dl{font-family:var(--serif);font-size:clamp(34px,9vw,52px);font-weight:500;text-decoration:none;display:block;padding:8px 0;border-bottom:1px solid rgba(198,166,107,.28)}
.drawer small{color:rgba(248,246,241,.6);font-size:14px}
@media (min-width:1020px){.menu{display:flex}.burger{display:none}.drawer{display:none}}

/* ---------- buttons ---------- */
.btns{display:flex;flex-wrap:wrap;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 32px;border:1px solid var(--navy);font:500 14px/1 var(--sans);letter-spacing:.06em;text-decoration:none;cursor:pointer;transition:background .35s,color .35s,border-color .35s,transform .35s}
.btn.pri{background:var(--navy);color:var(--ivory)}
.btn.pri:hover{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.sec2{background:transparent;color:var(--navy)}
.btn.sec2:hover{background:var(--navy);color:var(--ivory)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.gold:hover{background:transparent;color:var(--gold)}
.btn.ghost{background:transparent;border-color:rgba(198,166,107,.6);color:var(--ivory)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}

/* ---------- hero ---------- */
.hero{padding-top:clamp(36px,6vw,80px);padding-bottom:0}
.hero-grid{display:grid;gap:clamp(40px,6vw,96px);align-items:center}
.hero-label{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);font-weight:500;display:flex;align-items:center;gap:14px;margin-bottom:30px}
.hero-label::before{content:"";width:40px;height:1px;background:var(--gold)}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(46px,8.2vw,118px);line-height:.98;letter-spacing:-.015em;color:var(--navy);margin-bottom:34px}
.hero h1 .ln{display:block}
.hero .intro{max-width:52ch;color:var(--char);margin-bottom:18px}
.hero .intro strong{font-family:var(--serif);font-size:1.45em;font-weight:500;color:var(--navy);display:block;margin-bottom:6px}
.hero .second{font-family:var(--serif);font-style:italic;font-size:clamp(20px,2vw,26px);line-height:1.4;color:var(--gold-deep);max-width:34ch;margin-bottom:38px}
.hl{opacity:0;transform:translateY(26px);animation:rise 1.1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.d1{animation-delay:.05s}.d2{animation-delay:.2s}.d3{animation-delay:.35s}.d4{animation-delay:.55s}.d5{animation-delay:.7s}.d6{animation-delay:.85s}
.portrait{position:relative;width:min(100%,460px);margin-inline:auto 0;padding:0 22px 22px 0}
.portrait::before{content:"";position:absolute;right:0;bottom:0;width:calc(100% - 22px);height:calc(100% - 22px);border:1px solid var(--gold)}
.pframe{position:relative;aspect-ratio:4/5;background:var(--navy);overflow:hidden;display:flex;align-items:center;justify-content:center}
.pframe img{width:100%;height:100%;object-fit:cover}
.pph{text-align:center;color:var(--ivory);padding:24px}
.pph .mono{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(96px,16vw,170px);line-height:1;color:var(--gold)}
.pph .bar{display:block;width:56px;height:1px;background:var(--gold);margin:18px auto}
.pph p{font-size:14px;letter-spacing:.04em;color:rgba(248,246,241,.72);max-width:24ch;margin-inline:auto}
.ptag{position:absolute;left:-6px;bottom:-4px;background:var(--ivory);padding:14px 20px;border-left:2px solid var(--gold);font-size:13px;line-height:1.45;color:var(--navy);box-shadow:0 1px 0 rgba(16,27,45,.06)}
.ptag b{display:block;font-family:var(--serif);font-size:19px;font-weight:600}
.strip{margin-top:clamp(56px,8vw,110px);border-top:1px solid var(--gold);display:grid;grid-template-columns:1fr}
.strip div{padding:22px 0;border-bottom:1px solid rgba(198,166,107,.4);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--navy);font-weight:500;line-height:1.6}
.strip div:last-child{border-bottom:0}
@media (min-width:760px){.strip{grid-template-columns:repeat(4,auto);justify-content:space-between}.strip div{padding:26px 24px;border-bottom:0;border-left:1px solid rgba(198,166,107,.45)}.strip div:first-child{border-left:0;padding-left:0}.strip div:last-child{padding-right:0}}
@media (min-width:960px){.hero-grid{grid-template-columns:1.2fr .8fr}}

/* ---------- about ---------- */
.about-grid{display:grid;gap:clamp(36px,6vw,96px)}
.about-body p{margin-bottom:22px;color:var(--char);max-width:58ch}
.about-body p:first-child{font-family:var(--serif);font-size:clamp(22px,2.2vw,29px);line-height:1.45;color:var(--navy)}
@media (min-width:960px){.about-grid{grid-template-columns:1.05fr .95fr}.about-body{padding-top:14px}}
.defines{margin-top:clamp(64px,8vw,110px);border-top:1px solid var(--gold);padding-top:26px}
.defines h3{font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--gold-deep);margin-bottom:12px}
.def-grid{display:grid;grid-template-columns:1fr 1fr}
.def{padding:28px 0;border-bottom:1px solid rgba(198,166,107,.4);font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(30px,5vw,64px);line-height:1.1;color:var(--navy);position:relative;transition:color .4s,padding-left .4s}
.def:hover{color:var(--gold-deep);padding-left:10px}
@media (min-width:900px){.def-grid{grid-template-columns:repeat(4,1fr)}.def{border-bottom:0;border-left:1px solid rgba(198,166,107,.4);padding:44px 24px}.def:first-child{border-left:0;padding-left:0}.def:hover{padding-left:34px}.def:first-child:hover{padding-left:10px}}

/* ---------- education ---------- */
.edu-row{display:grid;gap:12px 40px;padding:clamp(30px,4vw,52px) 0;border-top:1px solid rgba(198,166,107,.55)}
.edu-row:last-child{border-bottom:1px solid rgba(198,166,107,.55)}
.edu-yr{font-family:var(--serif);font-size:clamp(34px,4.2vw,58px);font-weight:500;color:var(--gold-deep);line-height:1}
.edu-lv{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey-text);font-weight:500;margin-bottom:8px}
.edu-name{font-family:var(--serif);font-size:clamp(26px,3vw,40px);line-height:1.15;color:var(--navy);font-weight:500;margin-bottom:6px}
.edu-sch{color:var(--grey-text)}
.edu-score{margin-top:18px;display:flex;align-items:baseline;gap:14px}
.edu-score b{font-family:var(--serif);font-size:clamp(40px,5vw,64px);font-weight:500;color:var(--navy);line-height:1}
.edu-score span{font-size:14px;color:var(--grey-text)}
@media (min-width:860px){.edu-row{grid-template-columns:.7fr 1.3fr}}

/* ---------- leadership timeline ---------- */
.tl{--tlpad:clamp(24px,6vw,96px);position:relative;padding-left:var(--tlpad);margin-top:clamp(48px,6vw,84px)}
.tl::before{content:"";position:absolute;left:0;top:10px;bottom:0;width:1px;background:linear-gradient(var(--gold),rgba(198,166,107,.15))}
.tli{position:relative;padding-bottom:clamp(54px,7vw,100px);display:grid;gap:20px 56px}
.tli:last-child{padding-bottom:0}
.tli::before{content:"";position:absolute;left:calc(-1 * var(--tlpad) - 5px);top:12px;width:11px;height:11px;background:var(--ivory);border:1px solid var(--gold);transform:rotate(45deg)}
.tli .yr{font-size:14px;letter-spacing:.1em;color:var(--gold-deep);font-weight:500;margin-bottom:12px}
.tli h3{font-family:var(--serif);font-size:clamp(34px,4.6vw,64px);line-height:1.02;font-weight:500;color:var(--navy);letter-spacing:-.01em}
.tli .org{margin-top:12px;color:var(--grey-text);font-size:16px}
.tli .org b{color:var(--char);font-weight:500}
.tli .desc{max-width:56ch;color:var(--char)}
.sub{margin-top:22px}
.sub h4{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-text);font-weight:500;margin-bottom:10px}
.sub li{padding:7px 0 7px 22px;position:relative;font-size:16px;color:var(--char)}
.sub li::before{content:"";position:absolute;left:0;top:19px;width:10px;height:1px;background:var(--gold)}
.strengths{margin-top:26px;display:flex;flex-wrap:wrap;gap:6px 24px}
.strengths li{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:500;color:var(--navy)}
.strengths li::before{content:"";width:14px;height:1px;background:var(--gold)}
@media (min-width:980px){.tli{grid-template-columns:1fr 1fr}}

/* ---------- intellect ---------- */
.intel{overflow:hidden}
.intel .ghost{position:absolute;left:50%;bottom:-.12em;transform:translateX(-50%);font-family:var(--serif);font-weight:600;font-size:clamp(70px,19vw,300px);line-height:1;white-space:nowrap;color:transparent;-webkit-text-stroke:1px rgba(198,166,107,.2);pointer-events:none;user-select:none}
.intel .wrap{position:relative;z-index:1}
.intel .evt{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin:34px 0 0;font-size:15px;color:rgba(248,246,241,.8)}
.intel .evt b{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--gold)}
.nums{display:grid;grid-template-columns:1fr 1fr;margin-top:clamp(44px,6vw,84px);border-top:1px solid var(--gold)}
.num{padding:clamp(22px,3vw,40px) 0;border-bottom:1px solid rgba(198,166,107,.28)}
.num:nth-child(even){padding-left:clamp(16px,3vw,40px);border-left:1px solid rgba(198,166,107,.28)}
.num strong{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(56px,10vw,148px);line-height:.95;color:var(--ivory);letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}
.num span{display:block;margin-top:12px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:500}
.intel-desc{display:grid;gap:18px 56px;margin-top:clamp(36px,5vw,64px);max-width:1000px}
.intel-desc p{color:rgba(248,246,241,.8)}
@media (min-width:900px){.nums{grid-template-columns:repeat(4,1fr)}.num{border-bottom:0;padding-left:clamp(16px,2.4vw,36px);border-left:1px solid rgba(198,166,107,.28)}.num:first-child{border-left:0;padding-left:0}.num:nth-child(even){padding-left:clamp(16px,2.4vw,36px)}.intel-desc{grid-template-columns:1fr 1fr}}

/* ---------- experience ---------- */
.xp{display:grid;gap:clamp(36px,5vw,80px);margin-top:clamp(40px,5vw,70px);border-top:1px solid var(--gold);padding-top:clamp(32px,4vw,56px)}
.xp h3{font-family:var(--serif);font-size:clamp(30px,3.6vw,50px);font-weight:500;line-height:1.08;color:var(--navy)}
.xp .sub2{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--gold-deep);margin-top:8px}
.xp .meta{margin-top:24px;font-size:15px;color:var(--grey-text);line-height:1.7}
.xp .meta b{color:var(--char);font-weight:500}
.xp .txt p{margin-bottom:18px;max-width:60ch}
.xp ul.caps{display:grid;gap:0 36px;margin-top:30px;grid-template-columns:1fr}
.xp ul.caps li{padding:11px 0;border-top:1px solid rgba(198,166,107,.4);font-size:15.5px;color:var(--navy);font-weight:500}
@media (min-width:560px){.xp ul.caps{grid-template-columns:1fr 1fr}}
@media (min-width:960px){.xp{grid-template-columns:.85fr 1.15fr}}

/* ---------- projects ---------- */
.pj-grid{display:grid;gap:0;margin-top:clamp(40px,5vw,72px)}
.pj{padding:clamp(30px,4vw,56px) 0;border-top:1px solid var(--gold)}
.pj .tag{font-size:14px;color:var(--gold-deep);letter-spacing:.06em;font-weight:500;margin-bottom:16px}
.pj h3{font-family:var(--serif);font-size:clamp(30px,3.4vw,46px);font-weight:500;line-height:1.08;color:var(--navy);margin-bottom:20px}
.pj p{color:var(--char);margin-bottom:14px;max-width:52ch;font-size:16.5px}
.themes{margin-top:24px;display:flex;flex-wrap:wrap;gap:6px 22px}
.themes li{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:500;color:var(--navy)}
.themes li::before{content:"";width:14px;height:1px;background:var(--gold)}
@media (min-width:900px){.pj-grid{grid-template-columns:1fr 1fr}.pj{padding-right:clamp(24px,4vw,64px)}.pj+.pj{padding-right:0;padding-left:clamp(24px,4vw,64px);border-left:1px solid rgba(198,166,107,.55)}}

/* ---------- achievements ---------- */
.ach-grid{display:grid;gap:clamp(48px,6vw,80px);margin-top:clamp(40px,5vw,70px)}
.ach{border-top:2px solid var(--gold);padding-top:26px}
.ach .rank{font-family:var(--serif);font-weight:500;font-size:clamp(54px,8vw,116px);line-height:.95;color:var(--navy);letter-spacing:-.02em}
.ach .rank i{color:var(--gold-deep)}
.ach h3{font-family:var(--serif);font-size:clamp(24px,2.6vw,34px);font-weight:500;color:var(--navy);margin-top:22px;line-height:1.2}
.ach .where{color:var(--grey-text);font-size:15.5px;margin-top:6px}
.ach p.d{margin-top:16px;max-width:42ch}
@media (min-width:900px){.ach-grid{grid-template-columns:1fr 1fr;gap:clamp(40px,6vw,110px)}}

/* ---------- capabilities ---------- */
.cap-grid{display:grid;gap:0 clamp(28px,4vw,64px);margin-top:clamp(40px,5vw,70px);grid-template-columns:1fr}
.cap{padding:30px 0 40px;border-top:1px solid var(--gold)}
.cap h3{font-family:var(--serif);font-size:clamp(25px,2.3vw,31px);font-weight:600;line-height:1.15;color:var(--navy);margin-bottom:14px}
.cap p{color:var(--grey-text);font-size:16px;max-width:38ch}
@media (min-width:640px){.cap-grid{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.cap-grid{grid-template-columns:repeat(3,1fr)}}

/* ---------- executive support ---------- */
.ex-grid{display:grid;gap:clamp(40px,6vw,96px)}
.ex-list li{display:grid;grid-template-columns:54px 1fr;align-items:baseline;padding:22px 0;border-top:1px solid rgba(198,166,107,.55);transition:padding-left .4s ease}
.ex-list li:last-child{border-bottom:1px solid rgba(198,166,107,.55)}
.ex-list li:hover{padding-left:12px}
.ex-list .n{font-size:14px;color:var(--gold-deep);font-weight:500;letter-spacing:.08em}
.ex-list .t{font-family:var(--serif);font-size:clamp(24px,2.8vw,36px);line-height:1.15;color:var(--navy);font-weight:500}
.ex-quote{margin-top:36px;padding-left:20px;border-left:2px solid var(--gold);font-family:var(--serif);font-style:italic;font-size:clamp(20px,2vw,26px);line-height:1.4;color:var(--navy);max-width:34ch}
@media (min-width:960px){.ex-grid{grid-template-columns:.95fr 1.05fr}.ex-sticky{position:sticky;top:120px;align-self:start}}

/* ---------- languages ---------- */
.lang-row{display:grid;grid-template-columns:1fr 1fr;margin-top:clamp(36px,5vw,64px);border-top:1px solid var(--gold)}
.lang{padding:clamp(24px,3vw,44px) 0;border-bottom:1px solid rgba(198,166,107,.4);font-family:var(--serif);font-size:clamp(34px,5.6vw,80px);font-weight:500;color:var(--navy);line-height:1;letter-spacing:-.01em}
.lang:nth-child(even){padding-left:clamp(16px,3vw,40px);border-left:1px solid rgba(198,166,107,.4)}
@media (min-width:900px){.lang-row{grid-template-columns:repeat(4,1fr)}.lang{border-bottom:0;border-left:1px solid rgba(198,166,107,.4);padding-left:clamp(18px,2.4vw,36px)}.lang:first-child{border-left:0;padding-left:0}.lang:nth-child(even){padding-left:clamp(18px,2.4vw,36px)}}

/* ---------- philosophy ---------- */
.phil{min-height:100svh;display:flex;align-items:center;background:var(--ivory);color:var(--navy);overflow:hidden;transition:color .7s ease}
.phil::before{content:"";position:absolute;inset:0;background:var(--navy);opacity:var(--p,0)}
.phil .wrap{position:relative;z-index:1}
.phil.dark{color:var(--ivory)}
.phil .qrule{display:block;width:72px;height:1px;background:var(--gold);margin-bottom:38px}
.phil blockquote{margin:0;max-width:20ch}
.phil .q1{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(36px,6.4vw,96px);line-height:1.06;letter-spacing:-.015em;max-width:18ch}
.phil .q2{font-family:var(--serif);font-size:clamp(20px,2.3vw,30px);line-height:1.45;margin-top:clamp(30px,4vw,56px);max-width:36ch;color:inherit;opacity:.85}

/* ---------- contact ---------- */
.contact h2.display{max-width:12ch}
.c-grid{display:grid;gap:clamp(36px,5vw,80px);margin-top:clamp(28px,4vw,48px)}
.c-list li{display:grid;gap:4px 24px;padding:24px 0;border-top:1px solid rgba(198,166,107,.4);align-items:center}
.c-list li:last-child{border-bottom:1px solid rgba(198,166,107,.4)}
.c-list .k{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:500}
.c-list a.v,.c-list .v{font-family:var(--serif);font-size:clamp(22px,2.6vw,34px);color:var(--ivory);text-decoration:none;line-height:1.2;overflow-wrap:anywhere;background:linear-gradient(var(--gold),var(--gold)) 0 100%/0 1px no-repeat;transition:background-size .4s;width:fit-content}
.c-list a.v:hover{background-size:100% 1px}
.copybtn{margin-top:10px;width:fit-content;min-height:44px;padding:0 20px;background:transparent;border:1px solid rgba(198,166,107,.6);color:var(--ivory);font:500 13.5px/1 var(--sans);letter-spacing:.05em;cursor:pointer;transition:border-color .3s,color .3s,background .3s}
.copybtn:hover{border-color:var(--gold);color:var(--gold)}
.copybtn.ok{background:var(--gold);border-color:var(--gold);color:var(--navy)}
@media (min-width:960px){.c-grid{grid-template-columns:.9fr 1.1fr;align-items:start}.c-list li{grid-template-columns:130px 1fr auto}.copybtn{margin-top:0}}

/* ---------- footer ---------- */
.foot{background:var(--navy);color:rgba(248,246,241,.7);border-top:1px solid rgba(198,166,107,.4);padding:36px 0 calc(36px + env(safe-area-inset-bottom,0px))}
.foot .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.foot b{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:.26em;color:var(--ivory)}
.totop{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;width:48px;height:48px;background:var(--navy);color:var(--gold);border:1px solid var(--gold);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .35s,transform .35s,visibility .35s,background .3s,color .3s}
.totop.show{opacity:1;visibility:visible;transform:none}
.totop:hover{background:var(--gold);color:var(--navy)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv,.hl{opacity:1;transform:none;animation:none;transition:none}
  *{transition-duration:.01ms !important}
}
</style>

/* ---------- helpers ---------- */
function Reveal({children,delay=0,className="",tag="div"}){
  const ref=useRef(null); const [on,setOn]=useState(false);
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    if(!("IntersectionObserver" in window)){setOn(true);return;}
    const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){setOn(true);io.disconnect();}});},{threshold:.1,rootMargin:"0px 0px -5% 0px"});
    io.observe(el); return()=>io.disconnect();
  },[]);
  return h(tag,{ref,className:"rv "+(on?"in ":"")+className,style:delay?{transitionDelay:delay+"ms"}:undefined},children);
}
function Counter({to,pad=2,suffix=""}){
  const ref=useRef(null); const [v,setV]=useState(0);
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce||!("IntersectionObserver" in window)){setV(to);return;}
    let raf; 
    const io=new IntersectionObserver(es=>{
      if(es[0].isIntersecting){
        io.disconnect(); const t0=performance.now(),D=1500;
        const tick=t=>{const p=Math.min((t-t0)/D,1); setV(Math.round(to*(1-Math.pow(1-p,3)))); if(p<1) raf=requestAnimationFrame(tick);};
        raf=requestAnimationFrame(tick);
      }
    },{threshold:.5});
    io.observe(el); return()=>{io.disconnect(); cancelAnimationFrame(raf);};
  },[to]);
  const txt = to>=1000 ? v.toLocaleString("en-US") : String(v).padStart(pad,"0");
  return h("strong",{ref,"aria-label":(to>=1000?to.toLocaleString("en-US"):String(to).padStart(pad,"0"))+suffix},h("span",{"aria-hidden":"true",style:{display:"inline",margin:0,letterSpacing:"inherit",fontSize:"inherit",textTransform:"none",color:"inherit"}},txt+suffix));
}

/* ---------- navigation ---------- */
function Nav(){
  const [open,setOpen]=useState(false); const [scrolled,setScrolled]=useState(false); const [active,setActive]=useState("home");
  useEffect(()=>{
    const ids=NAV.map(n=>n.id);
    const on=()=>{
      setScrolled(window.scrollY>10); let cur="home";
      for(const id of ids){const el=document.getElementById(id); if(el&&el.getBoundingClientRect().top<=150) cur=id;}
      setActive(cur);
    };
    on(); window.addEventListener("scroll",on,{passive:true}); return()=>window.removeEventListener("scroll",on);
  },[]);
  useEffect(()=>{
    document.body.style.overflow=open?"hidden":"";
    const k=e=>{if(e.key==="Escape") setOpen(false);};
    window.addEventListener("keydown",k); return()=>{window.removeEventListener("keydown",k);document.body.style.overflow="";};
  },[open]);
  return h(React.Fragment,null,
    h("header",{className:"nav"+(scrolled?" scrolled":"")},
      h("div",{className:"wrap"},
        h("a",{className:"brand",href:"#home","aria-label":"Lakshmi Devi, back to top"},"LAKSHMI DEVI"),
        h("nav",{className:"menu","aria-label":"Primary"},NAV.map(n=>h("a",{key:n.id,href:"#"+n.id,className:active===n.id?"act":"","aria-current":active===n.id?"true":undefined},n.label))),
        h("button",{className:"burger","aria-label":open?"Close menu":"Open menu","aria-expanded":open,"aria-controls":"drawer",onClick:()=>setOpen(!open)},h("span"),h("span"),h("span"))
      )
    ),
    h("div",{id:"drawer",className:"drawer"+(open?" open":""),"aria-hidden":!open},
      h("nav",{"aria-label":"Mobile"},NAV.map(n=>h("a",{key:n.id,className:"dl",href:"#"+n.id,tabIndex:open?0:-1,onClick:()=>setOpen(false)},n.label))),
      h("small",null,"Lakshmi Devi V — Personal Portfolio 2026")
    )
  );
}

/* ---------- philosophy ---------- */
function Philosophy(){
  const ref=useRef(null); const [dark,setDark]=useState(false);
  useEffect(()=>{
    let raf=0;
    const calc=()=>{
      raf=0; const el=ref.current; if(!el) return;
      const r=el.getBoundingClientRect(), vh=window.innerHeight;
      const p=Math.max(0,Math.min(1,(vh*0.85-r.top)/(vh*0.6)));
      el.style.setProperty("--p",p.toFixed(3)); setDark(p>0.5);
    };
    const on=()=>{if(!raf) raf=requestAnimationFrame(calc);};
    calc(); window.addEventListener("scroll",on,{passive:true}); window.addEventListener("resize",on);
    return()=>{window.removeEventListener("scroll",on);window.removeEventListener("resize",on);cancelAnimationFrame(raf);};
  },[]);
  return h("section",{id:"philosophy",ref,className:"sec phil"+(dark?" dark":""),"aria-labelledby":"philosophy-h"},
    h("div",{className:"wrap"},
      h(Reveal,null,h("h2",{id:"philosophy-h",style:{position:"absolute",width:1,height:1,overflow:"hidden",clip:"rect(0 0 0 0)"}},"Personal philosophy"),
        h("span",{className:"qrule"}),
        h("blockquote",{style:{maxWidth:"none"}},
          h("p",{className:"q1"},"Good support is often invisible, but its impact is felt everywhere."),
          h("p",{className:"q2"},"It is built on trust, thoughtful communication, responsibility, and the ability to make every detail count."))))
  );
}

/* ---------- contact ---------- */
function Contact(){
  const [state,setState]=useState("idle");
  const copy=async()=>{
    let ok=false;
    try{await navigator.clipboard.writeText(CONFIG.email);ok=true;}
    catch(_){try{const ta=document.createElement("textarea");ta.value=CONFIG.email;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();ok=document.execCommand("copy");ta.remove();}catch(__){ok=false;}}
    setState(ok?"ok":"fail"); setTimeout(()=>setState("idle"),2600);
  };
  return h("section",{id:"contact",className:"sec bg-navy contact","aria-labelledby":"contact-h"},
    h("div",{className:"wrap"},
      h(Reveal,null,h(Kicker,null,"Contact"),h("h2",{id:"contact-h",className:"display"},"Let's Begin a Conversation.")),
      h("div",{className:"c-grid"},
        h(Reveal,null,h("p",{className:"lede"},"Open to professional opportunities that value communication, coordination, responsibility, and continuous learning.")),
        h(Reveal,{delay:120},h("ul",{className:"c-list"},
          h("li",null,h("span",{className:"k"},"Email"),h("a",{className:"v",href:"mailto:"+CONFIG.email},CONFIG.email),
            h("button",{type:"button",className:"copybtn"+(state==="ok"?" ok":""),onClick:copy,"aria-live":"polite"},state==="ok"?"Email copied":state==="fail"?"Copy unavailable":"Copy email")),
          h("li",null,h("span",{className:"k"},"Phone"),h("a",{className:"v",href:"tel:"+CONFIG.phoneHref},CONFIG.phone),h("span")),
          h("li",null,h("span",{className:"k"},"LinkedIn"),h("a",{className:"v",href:CONFIG.linkedin,target:"_blank",rel:"noopener noreferrer"},"linkedin.com/in/lakshmidevi"),h("span")),
          h("li",null,h("span",{className:"k"},"GitHub"),h("a",{className:"v",href:CONFIG.github,target:"_blank",rel:"noopener noreferrer"},"github.com/Lakshmidevi125110"),h("span")))))
    )
  );
}
